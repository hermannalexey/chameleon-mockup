<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chameleon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  /* Dark-first: corporate palette is the brand default. Light theme derived below. */
  :root{
    --font: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    /* Corporate colours */
    --bg:#101214; --surface:#171A1F; --surface-2:#1D2229; --surface-3:#252C34;
    --border:#2A3138; --border-strong:#3A434D;
    --ink:#F3F5F7; --muted:#A7B0BA; --faint:#727E8A;
    --brand-green:#4F8F5B; --brand-purple:#6F5A96; --brand-teal:#3E8F95;
    --accent:#4F8F5B; --accent-bright:#63A971; --accent-strong:#88C596; --accent-soft:rgba(79,143,91,.17);
    --on-accent:#FFFFFF;
    --pri-high:#E8705A; --pri-high-soft:rgba(232,112,90,.16);
    --pri-med:#DBA646;  --pri-med-soft:rgba(219,166,70,.16);
    --pri-low:#6E93D6;  --pri-low-soft:rgba(110,147,214,.16);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.34);
    --shadow-lift:0 10px 34px rgba(0,0,0,.52);
    --radius:12px; --radius-sm:8px;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F4F6F7; --surface:#FFFFFF; --surface-2:#EFF2F4; --surface-3:#E5EAED;
      --border:#E1E6EA; --border-strong:#CCD4DA;
      --ink:#171A1F; --muted:#586470; --faint:#8A949E;
      --accent:#4F8F5B; --accent-bright:#438050; --accent-strong:#2F6B3D; --accent-soft:rgba(79,143,91,.14);
      --on-accent:#FFFFFF;
      --pri-high:#CB4E36; --pri-high-soft:rgba(203,78,54,.12);
      --pri-med:#B67F1F;  --pri-med-soft:rgba(182,127,31,.15);
      --pri-low:#3F6ABF;  --pri-low-soft:rgba(63,106,191,.12);
      --shadow:0 1px 2px rgba(16,40,30,.06), 0 4px 16px rgba(16,40,30,.07);
      --shadow-lift:0 10px 34px rgba(16,40,30,.16);
    }
  }
  :root[data-theme="light"]{
    --bg:#F4F6F7; --surface:#FFFFFF; --surface-2:#EFF2F4; --surface-3:#E5EAED;
    --border:#E1E6EA; --border-strong:#CCD4DA;
    --ink:#171A1F; --muted:#586470; --faint:#8A949E;
    --accent:#4F8F5B; --accent-bright:#438050; --accent-strong:#2F6B3D; --accent-soft:rgba(79,143,91,.14);
    --on-accent:#FFFFFF;
    --pri-high:#CB4E36; --pri-high-soft:rgba(203,78,54,.12);
    --pri-med:#B67F1F;  --pri-med-soft:rgba(182,127,31,.15);
    --pri-low:#3F6ABF;  --pri-low-soft:rgba(63,106,191,.12);
    --shadow:0 1px 2px rgba(16,40,30,.06), 0 4px 16px rgba(16,40,30,.07);
    --shadow-lift:0 10px 34px rgba(16,40,30,.16);
  }

  :root{color-scheme:dark}
  :root[data-theme="light"]{color-scheme:light}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:light}}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .tnum{font-variant-numeric:tabular-nums}

  .app{display:grid;grid-template-columns:262px 1fr;height:100%;overflow:hidden}

  /* ---------- Sidebar ---------- */
  .sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--brand-green),var(--brand-teal));display:grid;place-items:center;flex:none;box-shadow:0 2px 10px rgba(79,143,91,.4)}
  .logo svg{width:19px;height:19px}
  .brand b{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
  .nav-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
  .nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px}
  .nav a .ico{width:17px;height:17px;flex:none;opacity:.8}
  .nav a:hover{background:var(--surface-2);color:var(--ink)}
  .nav a.active{background:var(--accent-soft);color:var(--accent-strong)}
  .nav a.active .ico{opacity:1}
  .nav a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .proj-dot{width:10px;height:10px;border-radius:3px;flex:none}
  .nav a.sub-proj{padding:6px 10px 6px 30px;font-size:12.5px}
  .nav a .sub-ico{width:14px;height:14px;flex:none;opacity:.7;display:grid}
  .nav a .sub-ico svg{width:14px;height:14px}
  .nav .count{margin-left:auto;font-size:11px;color:var(--faint);font-weight:700}
  .side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .side-foot .who{font-size:12.5px;font-weight:700}
  .side-foot .who small{display:block;color:var(--faint);font-weight:600;font-size:11px}

  /* ---------- Main ---------- */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);flex:none}
  .menu-btn{display:none;background:none;border:1px solid var(--border);border-radius:8px;padding:7px;color:var(--ink)}
  .title-wrap{display:flex;align-items:center;gap:11px;min-width:0}
  .title-wrap .pdot{width:14px;height:14px;border-radius:4px;flex:none}
  h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .subtle{color:var(--faint);font-size:12.5px;font-weight:600}
  .spacer{flex:1}
  .seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
  .seg button{border:none;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:6px 13px;border-radius:7px;display:flex;align-items:center;gap:6px}
  .seg button svg{width:15px;height:15px}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .icon-btn{background:none;border:1px solid var(--border);border-radius:9px;padding:8px;color:var(--muted);display:grid;place-items:center}
  .icon-btn:hover{color:var(--ink);border-color:var(--border-strong)}
  .icon-btn svg{width:17px;height:17px}
  .btn-add{background:var(--accent);color:var(--on-accent);border:none;border-radius:9px;padding:9px 15px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;box-shadow:0 2px 8px rgba(79,143,91,.3)}
  .btn-add:hover{background:var(--accent-bright)}
  .btn-add svg{width:16px;height:16px}

  .content{flex:1;overflow:auto;min-height:0}

  /* avatars */
  .ava{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none;letter-spacing:.01em}
  .ava.sm{width:22px;height:22px;font-size:10px}

  /* priority pill */
  .pri{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:5px}
  .pri::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pri.high{color:var(--pri-high);background:var(--pri-high-soft)}
  .pri.med{color:var(--pri-med);background:var(--pri-med-soft)}
  .pri.low{color:var(--pri-low);background:var(--pri-low-soft)}
  .due{font-size:12px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
  .due svg{width:13px;height:13px;opacity:.7}
  .due.over{color:var(--pri-high)}
  .subc{font-size:12px;font-weight:700;color:var(--faint);display:inline-flex;align-items:center;gap:4px}
  .subc svg{width:13px;height:13px}

  /* checkbox */
  .chk{width:19px;height:19px;border:2px solid var(--border-strong);border-radius:6px;flex:none;display:grid;place-items:center;background:var(--surface);transition:.12s}
  .chk svg{width:12px;height:12px;opacity:0;color:#fff}
  .chk.done{background:var(--accent);border-color:var(--accent)}
  .chk.done svg{opacity:1}

  /* ---------- Board ---------- */
  .board{display:flex;gap:16px;padding:20px 22px;align-items:flex-start;min-height:100%}
  .col{background:var(--surface-2);border-radius:14px;width:290px;flex:none;display:flex;flex-direction:column;max-height:100%}
  .col.drop{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
  .col-head{display:flex;align-items:center;gap:8px;padding:13px 14px 9px;font-weight:800;font-size:13px}
  .col-head .cdot{width:9px;height:9px;border-radius:50%}
  .col-head .n{color:var(--faint);font-weight:700}
  .col-body{padding:4px 10px 10px;display:flex;flex-direction:column;gap:9px;overflow:auto}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;box-shadow:var(--shadow);cursor:grab;display:flex;flex-direction:column;gap:9px}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.45}
  .card .ct{display:flex;gap:9px;align-items:flex-start}
  .card .ctitle{font-weight:700;font-size:13.5px;line-height:1.35}
  .card.is-done .ctitle{text-decoration:line-through;color:var(--faint)}
  .card .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card .meta .spacer{flex:1}
  .add-card{margin:2px 10px 12px;border:none;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:8px;border-radius:8px;text-align:left;display:flex;align-items:center;gap:7px}
  .add-card:hover{background:var(--surface-3);color:var(--ink)}
  .add-card svg{width:15px;height:15px}
  .composer{margin:2px 10px 12px;display:flex;flex-direction:column;gap:8px}
  .composer textarea{border:1px solid var(--border-strong);border-radius:10px;padding:10px;font-family:inherit;font-size:13.5px;resize:none;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .composer textarea:focus{outline:none;border-color:var(--accent)}
  .composer .crow{display:flex;gap:8px}
  .composer .save{background:var(--accent);color:var(--on-accent);border:none;border-radius:8px;padding:7px 14px;font-weight:700;font-size:13px}
  .composer .cancel{background:none;border:none;color:var(--muted);font-weight:700;padding:7px 10px;border-radius:8px}

  /* ---------- List ---------- */
  .list{padding:14px 22px 40px;max-width:1000px}
  .sec{margin-top:14px}
  .sec-head{display:flex;align-items:center;gap:9px;padding:10px 6px 8px;font-weight:800;font-size:14px}
  .sec-head .cdot{width:9px;height:9px;border-radius:50%}
  .sec-head .n{color:var(--faint);font-weight:700;font-size:12px}
  .row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;cursor:pointer}
  .row:hover{border-color:var(--border-strong)}
  .row .rtitle{font-weight:600;font-size:13.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.is-done .rtitle{text-decoration:line-through;color:var(--faint)}
  .row .rmeta{display:flex;align-items:center;gap:14px}
  .row .pchip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
  .list-add{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;font-size:13px;padding:9px 12px;border-radius:9px;background:none;border:1px dashed var(--border-strong);width:100%;margin-top:4px}
  .list-add:hover{color:var(--ink);border-color:var(--accent)}
  .list-add svg{width:15px;height:15px}
  @media(max-width:640px){.row .rmeta .due,.row .rmeta .pchip{display:none}}

  /* ---------- My Tasks ---------- */
  .mt{padding:16px 22px 40px;max-width:860px}
  .bucket-head{font-weight:800;font-size:14px;padding:16px 6px 8px;display:flex;align-items:center;gap:9px}
  .bucket-head .flag{width:8px;height:16px;border-radius:3px}
  .bucket-head .n{color:var(--faint);font-weight:700;font-size:12px}
  .mt .row .proj{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;color:#fff}

  /* ---------- Plan (phased tree) ---------- */
  .plan{padding:16px 22px 44px;max-width:1000px}
  .gtask{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
  .gtask.done{border-color:var(--accent)}
  .gt-ico{font-size:22px;line-height:1}
  .gt-main{flex:1;min-width:0}
  .gt-name{font-weight:800;font-size:15px}
  .gt-bar{height:8px;background:var(--surface-3);border-radius:5px;margin-top:8px;overflow:hidden}
  .gt-bar span{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .25s}
  .gt-pct{font-weight:800;font-size:15px}
  .gt-meta{font-size:12px;color:var(--faint);font-weight:600;white-space:nowrap}
  .phase{display:flex;align-items:center;gap:11px;padding:11px 14px;border:1px solid var(--border);border-radius:11px;background:var(--surface);margin-bottom:6px;cursor:pointer}
  .phase.active{border-color:var(--accent)}
  .phase.locked{opacity:.6}
  .phase.done .ph-name{color:var(--muted)}
  .ph-caret{background:none;border:none;color:var(--faint);display:grid;place-items:center;padding:2px;cursor:pointer;flex:none}
  .ph-caret svg{width:15px;height:15px}
  .ph-badge{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
  .ph-badge.done{background:var(--accent);color:#fff}
  .ph-badge.done svg{width:14px;height:14px;color:#fff}
  .ph-badge.active{background:var(--accent-soft);color:var(--accent-strong);box-shadow:inset 0 0 0 2px var(--accent)}
  .ph-badge.locked{background:var(--surface-3);color:var(--faint)}
  .ph-badge.locked svg{width:13px;height:13px}
  .ph-badge.mini{width:20px;height:20px;font-size:11px;background:var(--surface-3);color:var(--muted)}
  .ph-name{font-weight:700;font-size:14px;flex:1;min-width:0}
  .ph-bar{width:84px;height:7px;background:var(--surface-3);border-radius:5px;overflow:hidden;flex:none}
  .ph-bar span{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .25s}
  .ph-pct{font-size:12.5px;font-weight:800;width:36px;text-align:right}
  .ph-sub{font-size:12px;color:var(--faint);font-weight:700;width:34px;text-align:center}
  .ph-due{font-size:12px;color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .ph-due svg{width:13px;height:13px;opacity:.7}
  .ph-due.late{color:var(--pri-high)}
  .subrow{display:flex;align-items:center;gap:11px;padding:9px 14px 9px 48px;border-bottom:1px solid var(--border);background:var(--surface)}
  .subrow:hover{background:var(--surface-2)}
  .subrow.is-done .sub-name{text-decoration:line-through;color:var(--faint)}
  .subrow.locked{opacity:.55}
  .sub-id{font-size:11px;font-weight:800;color:var(--faint);min-width:24px;font-variant-numeric:tabular-nums}
  .sub-name{font-weight:600;font-size:13.5px;flex:1;min-width:0;cursor:pointer}
  .sub-name:hover{color:var(--accent-strong)}
  .sub-meta{display:flex;align-items:center;gap:10px}
  .sublock{width:19px;height:19px;display:grid;place-items:center;color:var(--faint);flex:none}
  .sublock svg{width:14px;height:14px}
  .chk.sm{width:16px;height:16px;border-width:2px}
  .plan-banner{margin-top:14px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:11px;padding:11px 14px;font-size:13px;font-weight:600;color:var(--ink);line-height:1.45}
  .mark-btn[disabled]{opacity:.45;cursor:not-allowed}
  @media(max-width:640px){.ph-bar,.gt-meta{display:none}.subrow{padding-left:40px}}
  /* ---------- Timeline (Gantt) ---------- */
  .tl{padding:16px 22px 44px}
  .tl-ctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow);margin-bottom:12px}
  .tl-ctrl-l{font-weight:700;font-size:13px;color:var(--muted)}
  .stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:9px;padding:3px}
  .stepper button{width:28px;height:26px;border:none;background:var(--surface);color:var(--ink);border-radius:7px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
  .stepper button:hover{background:var(--surface-3)}
  .stepper #tlDays{min-width:34px;text-align:center;font-weight:800;font-size:13px}
  .tl-reset{background:none;border:none;color:var(--accent-strong);font-weight:700;font-size:12.5px;cursor:pointer}
  .dl-chip{font-size:12px;font-weight:800;padding:5px 10px;border-radius:8px}
  .dl-chip.ok{color:var(--accent-strong);background:var(--accent-soft)}
  .dl-chip.late{color:var(--pri-high);background:var(--pri-high-soft)}
  .tl-banner{background:var(--pri-med-soft);border:1px solid var(--pri-med);border-radius:11px;padding:11px 14px;font-size:13px;font-weight:600;color:var(--ink);line-height:1.5;margin-bottom:12px}
  .tl-banner.bad{background:var(--pri-high-soft);border-color:var(--pri-high)}
  .slip-tag{font-weight:800;color:var(--pri-high);background:var(--pri-high-soft);padding:1px 7px;border-radius:6px;font-size:12px}
  .tl-grid{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 14px 16px;overflow-x:auto}
  .tl-row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;min-height:38px;min-width:560px}
  .tl-head{min-height:30px}
  .tl-label{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl-track{position:relative;height:30px}
  .tl-tick{position:absolute;top:8px;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
  .tl-dl{position:absolute;top:-2px;bottom:-2px;width:0;border-left:2px dashed var(--pri-high);opacity:.55}
  .tl-dl-cap{position:absolute;top:-4px;transform:translateX(-50%);font-size:9.5px;font-weight:800;color:var(--pri-high);letter-spacing:.03em}
  .tl-bar{position:absolute;top:5px;height:20px;border-radius:6px;display:flex;align-items:center;padding:0 8px;overflow:hidden;box-shadow:var(--shadow)}
  .tl-bar span{font-size:11px;font-weight:800;color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .tl-bar.done{background:var(--brand-teal)}
  .tl-bar.active{background:var(--accent)}
  .tl-bar.locked{background:var(--faint)}
  .tl-bar.shifted{background:var(--pri-med);outline:2px solid var(--pri-med)}
  .tl-ghost{position:absolute;top:5px;height:20px;border-radius:6px;border:1.5px dashed var(--border-strong);background:transparent}
  @media(max-width:640px){.tl-row{grid-template-columns:96px 1fr}.tl-label{font-size:11px}}

  /* ---------- CRM ---------- */
  .stage-pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .deal{font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;letter-spacing:.02em}
  .deal.open{color:var(--muted);background:var(--surface-2)}
  .deal.won{color:var(--accent-strong);background:var(--accent-soft)}
  .deal.lost{color:var(--pri-high);background:var(--pri-high-soft)}
  .tag-crm{font-size:11px;font-weight:800;color:var(--brand-teal);background:rgba(62,143,149,.14);padding:3px 8px 3px 6px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
  .tag-crm svg{width:13px;height:13px}
  .lead-sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
  .card.lead{cursor:pointer}
  .card.lead .ctitle{font-size:13.5px}
  /* Leads table */
  .leads-wrap{padding:14px 22px 40px;overflow-x:auto}

/* ---------- My Tasks ---------- */
// Everything assigned to me: project tasks + phased-plan subtasks + my leads' next actions
function myItems(){
  const mine=tasks.filter(t=>t.assignee==="alex");
  const planItems=[];
  projects.filter(p=>p.plan).forEach(p=>planFor(p.id).forEach((ph,i)=>ph.subs.forEach(s=>{
    if(s.owner==="alex")planItems.push({_plan:{pid:p.id,ph,idx:i,s},section:s.done?"done":"todo",due:s.due,title:s.name});
  })));
  // Weave: each of my active leads' NEXT action becomes a to-do here
  const leadItems=leads.filter(l=>l.owner==="alex"&&l.deal==="open"&&l.next&&l.next.date&&l.next.task)
    .map(l=>({_lead:l, section:"todo", due:l.next.date, title:l.next.task}));
  return [...mine,...planItems,...leadItems];
}
function renderMyTasks(c){
  const wrap=el("div","mt");
  const all=myItems().sort((a,b)=>days(a.due)-days(b.due));
  const buckets=[
    {key:"over", label:"Overdue", color:"#E8705A", test:t=>t.section!=="done"&&isOver(t.due)},
    {key:"today",label:"Today",   color:"#DBA646", test:t=>t.section!=="done"&&t.due===fISO(TODAY)},
    {key:"week", label:"This week",color:"#4F8F5B",test:t=>{const d=days(t.due);return t.section!=="done"&&d>0&&d<7;}},
    {key:"later",label:"Later",   color:"#6E93D6", test:t=>{const d=days(t.due);return t.section!=="done"&&d>=7;}},
    {key:"done", label:"Completed",color:"#8A949E",test:t=>t.section==="done"},
  ];
  buckets.forEach(b=>{
    const items=all.filter(b.test);if(!items.length)return;
    const h=el("div","bucket-head",`<span class="flag" style="background:${b.color}"></span>${b.label}<span class="n">${items.length}</span>`);
    wrap.appendChild(h);
    items.forEach(t=>wrap.appendChild(t._lead?leadRow(t):t._plan?planRow(t):myRow(t)));
  });
  c.appendChild(wrap);
}

const fISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const days=d=>d?Math.round((new Date(d+"T00:00:00")-TODAY)/86400000):9999;

/* ================= CRM ================= */
const OUTREACH_ICO=svg('<path d="M4 4h16v12H5.2L4 17.2z"/><path d="M8 9h8M8 12h5"/>');
const LINK_ICO=svg('<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>');
const leadStage=id=>leadStages.find(s=>s.id===id);
const dealPill=d=>{const M={open:["Open","var(--muted)"],won:["Won","var(--accent-strong)"],lost:["Lost","var(--pri-high)"]};const x=M[d];return `<span class="deal ${d}">${x[0]}</span>`;};
function fmtDate(d){return d?new Date(d+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}):"—";}
function advanceNext(l){
  // "did this touch" — log it, feed the stats, and schedule the next touch from the cadence
  if(!(l.next&&l.next.task))return;
  const doneTask=l.next.task, today=fISO(TODAY);
  l.touches.push({date:today,task:doneTask,msg:l.strategy,answer:""}); l.last={date:today,task:doneTask};
  statFact(doneTask==="Connection request"?"req":doneTask==="Comment"?"com":"msg",1,l.ambassador);
  const nx=CADENCE[doneTask];
  l.next=nx?{task:nx[0],date:addDays(today,nx[1])}:{date:"",task:""};
  renderNav();render();
  if(state.selectedLead===l.id) openLead(l.id);
  toast(`Logged “${esc(doneTask)}” · ${esc(l.name)}${nx?` — next: ${esc(nx[0])}, ${fmtDue(l.next.date)}`:""}`);
}
// The prospect answered: record it, count it in Answers, and a reply means the lead is engaging
function logReply(l,idx,text,sentiment){
  const t=l.touches[idx]; if(!t||t.answer)return;
  t.answer=text; t.sentiment=sentiment;
  statFact("ans",1,l.ambassador);
  const order=leadStages.map(s=>s.id), before=order.indexOf(l.stage)<order.indexOf("engagement");
  if(before&&sentiment!=="negative"&&l.deal==="open"){setStage(l,"engagement");toast(`Reply logged · ${esc(l.name)} moved to Engagement`);}
  else{renderNav();render();openLead(l.id);toast(sentiment==="negative"?`Negative reply logged — consider marking ${esc(l.name)} as Lost`:`Reply logged · ${esc(l.name)}`);}
}
// Move a lead to a funnel stage: stamps entering dates, handles MQL ⇄ Won, keeps stats in step
function setStage(l,sid){
  if(l.stage===sid)return;
  const order=leadStages.map(s=>s.id), ni=order.indexOf(sid), wasMql=l.stage==="mql";
  l.stage=sid;
  order.forEach((id,i)=>{const k=DKEY[id];if(!k)return;
    if(i>ni)delete l.dates[k];                       // moved back: later stages not reached any more
    else if(i===ni)l.dates[k]=fISO(TODAY);           // entering today
    else if(!l.dates[k])l.dates[k]=fISO(TODAY);});   // skipped stages count as entered today
  if(ni>0&&l.statusLG!=="accepted")l.statusLG="accepted";
  if(sid==="mql"){l.deal="won";l.next={date:"",task:""};if(!l.details)l.details="Qualified — ready for hand-off to the client's sales team.";
    toast(`🎉 ${esc(l.name)} is an MQL — deal marked Won and added to the hand-off list`);}
  else if(wasMql){l.deal="open";}
  renderNav();render();
  if(state.selectedLead===l.id)openLead(l.id);
}
function setDeal(l,deal){
  if(deal==="lost"){l.deal="lost";l.lost=l.lost||LOST_REASONS[0];l.next={date:"",task:""};}
  else{l.deal=l.stage==="mql"?"won":"open";delete l.lost;if(l.deal==="open"&&!l.next.task)l.next={task:"Ping",date:fISO(TODAY)};}
  renderNav();render();openLead(l.id);
}

/* ---- Lead drawer ---- */
function openLead(id){
  const l=leads.find(x=>x.id===id);if(!l)return;
  state.selected=null;state.selectedPlanSub=null;state.selectedLead=id;
  const s=leadStage(l.stage);
  const steps=leadStages.filter(x=>x.id!=="connecting");
  const curIdx=steps.findIndex(x=>x.id===l.stage);
  const funnel=steps.map((x,i)=>{
    const done=l.dates[DKEY[x.id]];

/* ================= Plan: phased tree (dependencies + auto-unlock) ================= */
function planFor(pid){return plans[pid]||[];}
function phaseDone(ph){return ph.subs.every(s=>s.done);}
function phaseProgress(ph){const d=ph.subs.filter(s=>s.done).length;return {done:d,total:ph.subs.length,pct:Math.round(d/ph.subs.length*100)};}
const pastPhase=ph=>ph.subs.filter(s=>!s.done&&s.due>ph.due);   // steps scheduled after their phase's deadline
function phaseUnlocked(plan,i){return i===0||phaseDone(plan[i-1]);}
function subById(plan,id){for(const ph of plan)for(const s of ph.subs)if(s.id===id)return s;return null;}
function subActionable(plan,i,s){if(!phaseUnlocked(plan,i))return false; if(s.dependsOn){const d=subById(plan,s.dependsOn); if(d&&!d.done)return false;} return true;}
function planStats(pid){let d=0,t=0;planFor(pid).forEach(ph=>ph.subs.forEach(s=>{t++;if(s.done)d++;}));return{done:d,total:t,pct:t?Math.round(d/t*100):0};}
function planOpenCount(pid){const s=planStats(pid);return s.total-s.done;}
function toggleSub(pid,s){s.done=!s.done;renderNav();render();if(state.selectedPlanSub===s.id)openPlanTask(pid,s.id);}

function renderPlan(c){
  const pid=state.view, plan=planFor(pid), p=proj(pid), st=planStats(pid);
  const wrap=el("div","plan");
  const allDone=st.done===st.total;
  const gh=el("div","gtask"+(allDone?" done":""));
  gh.innerHTML=`<span class="gt-ico">${allDone?"🏁":"🎯"}</span>
    <div class="gt-main"><div class="gt-name">${p.name}</div>
      <div class="gt-bar"><span style="width:${st.pct}%"></span></div></div>
    <span class="gt-pct tnum">${st.pct}%</span>
    <span class="gt-meta">${st.total} subtasks · ${plan.length} phases</span>`;
  wrap.appendChild(gh);
  plan.forEach((ph,i)=>{
    const unlocked=phaseUnlocked(plan,i), pr=phaseProgress(ph), collapsed=planCollapsed.has(ph.id);
    const status = pr.pct===100?"done":(unlocked?"active":"locked");
    const badge = status==="done"?`<span class="ph-badge done">${CHECK}</span>`
      : status==="active"?`<span class="ph-badge active">${i+1}</span>`
      : `<span class="ph-badge locked">${LOCK}</span>`;
    const row=el("div","phase "+status);
    row.innerHTML=`<button class="ph-caret" aria-label="toggle">${collapsed?CARETR:CARETD}</button>${badge}
      <div class="ph-name">${i+1}. ${ph.name}</div>
      <div class="ph-bar"><span style="width:${pr.pct}%"></span></div>
      <span class="ph-pct tnum">${pr.pct}%</span>
      <span class="ph-sub">${pr.done}/${pr.total}</span>
      <span class="ph-due ${pastPhase(ph).length&&!phaseDone(ph)?"late":""}" ${pastPhase(ph).length?`title="${pastPhase(ph).length} step(s) due after this phase's deadline"`:""}>${pastPhase(ph).length&&!phaseDone(ph)?"⚠ ":""}${CAL}${fmtDate(ph.due)}</span>`;
    row.querySelector(".ph-caret").onclick=()=>{collapsed?planCollapsed.delete(ph.id):planCollapsed.add(ph.id);render();};
    row.onclick=e=>{if(!e.target.closest(".ph-caret")){collapsed?planCollapsed.delete(ph.id):planCollapsed.add(ph.id);render();}};
    wrap.appendChild(row);
    if(collapsed)return;
    ph.subs.forEach(s=>{
      const act=subActionable(plan,i,s);
      const sr=el("div","subrow"+(s.done?" is-done":"")+((act||s.done)?"":" locked"));
      const box = s.done?`<span class="chk done">${CHECK}</span>` : act?`<span class="chk"></span>` : `<span class="sublock">${LOCK}</span>`;
      sr.innerHTML=`${box}<span class="sub-id">${s.id}</span>
        <span class="sub-name">${esc(s.name)}</span>
        <span class="sub-meta">${s.priority==="high"?priPill("high"):""}
          <span class="due ${(isOver(s.due)||s.due>ph.due)&&!s.done?'over':''}" ${s.due>ph.due?`title="Due after the phase deadline (${fmtDate(ph.due)})"`:""}>${CAL}${fmtDate(s.due)}</span>${ava(s.owner,true)}</span>`;
      const chk=sr.querySelector(".chk"); if(chk&&(act||s.done))chk.onclick=e=>{e.stopPropagation();toggleSub(pid,s);};
      sr.querySelector(".sub-name").onclick=()=>openPlanTask(pid,s.id);
      wrap.appendChild(sr);
    });
  });
  wrap.appendChild(el("div","plan-banner",allDone?`🏁 <b>All phases complete — the global task closed automatically.</b>`:`🎉 When every subtask is done, <b>the global task closes automatically.</b> Completing a phase <b>auto-unlocks the next</b>.`));
  c.appendChild(wrap);
}

/* ---- Timeline (Gantt) with delay propagation ---- */
function renderTimeline(c){
  const pid=state.view, plan=planFor(pid), p=proj(pid);
  // Axis starts at the first scheduled step of the plan
  const firstDue=plan.flatMap(ph=>ph.subs.map(s=>s.due)).sort()[0];
  const AXIS=new Date(firstDue+"T00:00:00");
  const dn=ds=>Math.round((new Date(ds+"T00:00:00")-AXIS)/86400000);
  const dateAt=n=>{const d=new Date(AXIS);d.setDate(d.getDate()+n);return d;};
  const fmtN=n=>dateAt(n).toLocaleDateString("en-US",{month:"short",day:"numeric"});
  const DEADLINE=dn(p.deadline||plan[plan.length-1].due);
  // Baseline from the REAL plan dates: each phase spans from the day after the previous phase's
  // deadline to its own. A step scheduled past its phase deadline lengthens that phase, and the
  // overrun cascades to every later phase (it isn't silently absorbed).
  const base=[]; plan.forEach((ph,i)=>{
    const pStart=i===0?Math.min(...ph.subs.map(s=>dn(s.due))):dn(plan[i-1].due)+1;
    const pDur=Math.max(0,dn(ph.due)-pStart);
    const overrun=Math.max(0,Math.max(...ph.subs.filter(s=>!s.done).map(s=>dn(s.due)))-dn(ph.due));
    const start=i===0?pStart:Math.max(pStart,base[i-1].end+1);
    base.push({ph,start,end:start+pDur+overrun});
  });
  // effective schedule: a slip on the chosen phase pushes every later phase
  const delay={}; if(state.delayDays>0) delay[state.delayPhase]=state.delayDays;
  const eff=[]; let prev=-1;
  base.forEach((b,i)=>{const d=b.end-b.start; const start=i===0?b.start:Math.max(b.start,prev+1); const end=start+d+(delay[b.ph.id]||0); eff.push({start,end}); prev=end;});
  const baseFinish=base[base.length-1].end, effFinish=eff[eff.length-1].end, slip=effFinish-baseFinish;
  const overBy=effFinish-DEADLINE;
  const AXIS_DAYS=Math.max(effFinish,DEADLINE)+5;                  // stretches when a slip pushes past the deadline
  const L=x=>x/AXIS_DAYS*100, W=(a,z)=>(z-a+1)/AXIS_DAYS*100;
  const dlLabel=fmtN(DEADLINE);

  const wrap=el("div","tl");
  // control panel
  const ctrl=el("div","tl-ctrl");
  ctrl.innerHTML=`<span class="tl-ctrl-l">Simulate a slip:</span>
    <select id="tlPhase" class="crm-sel">${plan.map(ph=>`<option value="${ph.id}" ${state.delayPhase===ph.id?"selected":""}>${ph.name}</option>`).join("")}</select>
    <span class="stepper"><button id="tlMinus" aria-label="less">−</button><span class="tnum" id="tlDays">${state.delayDays}d</span><button id="tlPlus" aria-label="more">+</button></span>
    ${state.delayDays>0?`<button class="tl-reset" id="tlReset">Reset</button>`:""}
    <span class="spacer"></span>
    <span class="dl-chip ${overBy>0?'late':'ok'}">Finish ${fmtN(effFinish)} · ${overBy>0?`${overBy}d over deadline`:overBy===0?`on the ${dlLabel} deadline — no slack`:`${-overBy}d slack to ${dlLabel}`}</span>`;
  wrap.appendChild(ctrl);
  if(slip>0){
    const dphase=plan.find(p=>p.id===state.delayPhase);
    wrap.appendChild(el("div","tl-banner"+(overBy>0?" bad":""),`⚠ <b>${dphase.name}</b> slips ${state.delayDays} day${state.delayDays>1?"s":""} → later phases shift. Projected finish <b>${fmtN(baseFinish)} → ${fmtN(effFinish)}</b> <span class="slip-tag">+${slip}d</span>${overBy>0?` — <b>misses the ${dlLabel} deadline by ${overBy}d.</b>`:` — still within the ${dlLabel} deadline.`}`));
  }else if(overBy>=0){
    wrap.appendChild(el("div","tl-banner"+(overBy>0?" bad":""),overBy>0?`⚠ The current plan already finishes <b>${overBy}d after</b> the ${dlLabel} deadline.`:`The plan finishes exactly on the <b>${dlLabel}</b> deadline — <b>any slip</b> in any phase makes it late. Try the simulator.`));
  }
  // gantt
  const g=el("div","tl-grid");
  const dlLine=n=>`<span class="tl-dl" style="left:${L(n)}%"></span>`;
  const head=el("div","tl-row tl-head");
  const ticks=[];for(let n=0;n<AXIS_DAYS-2;n+=AXIS_DAYS>45?7:5)ticks.push(n);
  head.innerHTML=`<div class="tl-label"></div><div class="tl-track">${ticks.map(n=>`<span class="tl-tick" style="left:${L(n)}%">${fmtN(n)}</span>`).join("")}${dlLine(DEADLINE)}<span class="tl-dl-cap" style="left:${L(DEADLINE)}%">Deadline</span></div>`;
  g.appendChild(head);
  plan.forEach((ph,i)=>{
    const b=base[i], e=eff[i];
    const status = phaseProgress(ph).pct===100?"done":(phaseUnlocked(plan,i)?"active":"locked");
    const shifted = e.start>b.start || (delay[ph.id]||0)>0;
    const ghost = shifted?`<div class="tl-ghost" style="left:${L(b.start)}%;width:${W(b.start,b.end)}%"></div>`:"";
    const bar=`<div class="tl-bar ${status}${shifted?" shifted":""}" style="left:${L(e.start)}%;width:${W(e.start,e.end)}%"><span>${ph.name}</span></div>`;
    const row=el("div","tl-row");
    row.innerHTML=`<div class="tl-label">${i+1}. ${ph.name}</div><div class="tl-track">${dlLine(DEADLINE)}${ghost}${bar}</div>`;
    g.appendChild(row);
  });
  wrap.appendChild(g);
  c.appendChild(wrap);
  const setDays=n=>{state.delayDays=Math.max(0,Math.min(14,n));render();};
  $("#tlPhase").onchange=e=>{state.delayPhase=e.target.value;render();};
  $("#tlPlus").onclick=()=>setDays(state.delayDays+1);
  $("#tlMinus").onclick=()=>setDays(state.delayDays-1);
  const rb=$("#tlReset"); if(rb)rb.onclick=()=>setDays(0);
}

/* ---------- Inbox (light placeholder, still real content) ---------- */

    {u:"dmytro",txt:"completed <b>Pre-event LinkedIn teasers</b>",t:"5h"},

/* ---------- actions ---------- */
function toggleDone(t){
  if(t.section==="done"){t.section=t._prev||"todo";}
  else{t._prev=t.section;t.section="done";}
  renderNav();render();
  if(state.selected===t.id)openTask(t.id);
}

/* ---------- Drawer ---------- */
function openTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  state.selected=id;state.selectedLead=null;state.selectedPlanSub=null;
  const p=proj(t.project);
  if(!t.comments)t.comments=[];
  const opts=(list,cur)=>list.map(([v,l])=>`<option value="${v}" ${v===cur?"selected":""}>${esc(l)}</option>`).join("");
  const comments=t.comments.map(c=>`<div class="cmt">${ava(c.u,true)}<div><div class="cmt-h">${users[c.u].name}<small>${fmtDate(c.t)}</small></div><div class="cmt-t">${esc(c.txt)}</div></div></div>`).join("");
  const dr=$("#drawer");
  dr.innerHTML=`
    <div class="dr-top">
      <button class="mark-btn ${t.section==="done"?"done":""}" id="drMark">${CHECK}${t.section==="done"?"Completed":"Mark complete"}</button>
      <div class="spacer"></div>
      <button class="icon-btn" id="drClose" aria-label="Close">${svg('<path d="M18 6 6 18M6 6l12 12"/>')}</button>
    </div>
    <div class="dr-body">
      <input class="dr-title" value="${esc(t.title)}" aria-label="Task name">
      <div class="fields">
        <div class="field"><span class="k">${svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>')}Assignee</span><span class="v">${ava(t.assignee,true)}<select class="fin" id="tAssignee">${opts(Object.entries(users).map(([k,u])=>[k,u.name]),t.assignee)}</select></span></div>
        <div class="field"><span class="k">${CAL}Due date</span><span class="v"><input type="date" class="fin" id="tDue" value="${t.due||""}">${t.due&&isOver(t.due)&&t.section!=="done"?`<span class="due over">${fmtDue(t.due)}</span>`:""}</span></div>
        <div class="field"><span class="k">${svg('<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22V3"/>')}Priority</span><span class="v"><select class="fin" id="tPri">${opts([["high","High"],["med","Medium"],["low","Low"]],t.priority)}</select></span></div>
        <div class="field"><span class="k">${svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>')}Project</span><span class="v"><span class="proj-dot" style="width:11px;height:11px;border-radius:4px;background:${p.color};display:inline-block"></span> ${esc(p.name)}</span></div>
        <div class="field"><span class="k">${svg('<path d="M4 6h16M4 12h16M4 18h10"/>')}Status</span><span class="v"><select class="fin" id="tSec">${opts(sections.map(x=>[x.id,x.name]),t.section)}</select></span></div>
      </div>
      <div>
        <div class="dr-sec-label">Description</div>
        <div class="desc">${t.desc?t.desc:"<i style='color:var(--faint)'>No description yet.</i>"}</div>
      </div>
      <div>
        <div class="dr-sec-label">Subtasks ${t.subs.length?`· ${t.subs.filter(x=>x.done).length}/${t.subs.length}`:""}</div>
        <div id="drSubs">${t.subs.length?"":"<div class='desc'><i style='color:var(--faint)'>No subtasks.</i></div>"}</div>
      </div>
      <div>
        <div class="dr-sec-label">Comments ${t.comments.length?`· ${t.comments.length}`:""}</div>
        ${comments}
        <div class="cbox">${ava("alex",true)}<input id="tCmt" placeholder="Write a comment… (Enter to post)"></div>
      </div>
    </div>`;
  const subsBox=dr.querySelector("#drSubs");
  t.subs.forEach((st,i)=>{
    const it=el("div","sub-item"+(st.done?" done":""));
    it.innerHTML=`<span class="chk ${st.done?"done":""}">${CHECK}</span><span class="st">${st.t}</span>`;
    it.querySelector(".chk").onclick=()=>{st.done=!st.done;openTask(id);render();};
    subsBox.appendChild(it);
  });
  dr.querySelector("#drClose").onclick=closeDrawer;
  dr.querySelector("#drMark").onclick=()=>toggleDone(t);
  dr.querySelector(".dr-title").onchange=e=>{const v=e.target.value.trim();if(v){t.title=v;render();}else e.target.value=t.title;};
  const upd=fn=>e=>{fn(e.target.value);renderNav();render();openTask(id);};
  dr.querySelector("#tAssignee").onchange=upd(v=>t.assignee=v);
  dr.querySelector("#tDue").onchange=upd(v=>t.due=v||null);
  dr.querySelector("#tPri").onchange=upd(v=>t.priority=v);
  dr.querySelector("#tSec").onchange=upd(v=>{if(v==="done"&&t.section!=="done")t._prev=t.section;t.section=v;});
  const ci=dr.querySelector("#tCmt");
  ci.onkeydown=e=>{if(e.key==="Enter"&&ci.value.trim()){t.comments.push({u:"alex",t:fISO(TODAY),txt:ci.value.trim()});openTask(id);const n=$("#tCmt");if(n)n.focus();}};
  dr.classList.add("open");dr.setAttribute("aria-hidden","false");
  $("#scrim").classList.add("open");
}
function closeDrawer(){state.selected=null;state.selectedLead=null;state.selectedPlanSub=null;$("#drawer").classList.remove("open");$("#drawer").setAttribute("aria-hidden","true");$("#scrim").classList.remove("open");closeModal();}

/* ---------- wire top bar ---------- */
// (the view-switcher buttons are built per-project by buildSeg)
$("#addBtn").onclick=()=>{
  const p=proj(state.view);
  if(state.view==="crm") return openLeadModal();
  if(p&&!p.plan&&state.layout==="board"){state.composeFor="todo";render();return;}  // inline composer where it's already visible
  openTaskModal();
};

/* ---------- Create modals (task from anywhere, lead from the CRM) ---------- */
function openModal(html,onSubmit){
  const m=$("#modal");m.innerHTML=`<form novalidate>${html}<div class="mact"><button type="button" class="ghost-btn" id="mCancel">Cancel</button><button type="submit" class="btn-add">Create</button></div></form>`;
  const f=m.querySelector("form");
  f.onsubmit=e=>{e.preventDefault();if(onSubmit(new FormData(f))!==false)closeModal();};
  m.querySelector("#mCancel").onclick=closeModal;
  m.classList.add("open");m.setAttribute("aria-hidden","false");$("#scrim").classList.add("open");
  const first=f.querySelector("input");if(first)first.focus();
  return f;
}
function closeModal(){const m=$("#modal");if(!m.classList.contains("open"))return;m.classList.remove("open");m.setAttribute("aria-hidden","true");
  if(!$("#drawer").classList.contains("open"))$("#scrim").classList.remove("open");}
const userOpts=cur=>Object.entries(users).map(([k,u])=>`<option value="${k}" ${k===cur?"selected":""}>${u.name}</option>`).join("");
function openTaskModal(){
  const cur=proj(state.view);
  // Regular projects take the task directly; phased projects take it as a subtask of a chosen phase
  const dest=[...projects.filter(p=>!p.plan),...projects.filter(p=>p.plan)].map(p=>p.plan
    ? `<optgroup label="${esc(p.name)}">${planFor(p.id).map((ph,i)=>`<option value="${p.id}|${ph.id}" ${cur&&cur.id===p.id&&phaseUnlocked(planFor(p.id),i)&&!phaseDone(ph)?"selected":""}>${i+1}. ${esc(ph.name)}</option>`).join("")}</optgroup>`
    : `<option value="${p.id}" ${cur&&cur.id===p.id?"selected":""}>${esc(p.name)}</option>`).join("");
  const f=openModal(`<h2>New task</h2>
    <label class="mfield"><span>Task name</span><input class="fin" name="title" placeholder="What needs doing?" required></label>
    <label class="mfield"><span>Project</span><select class="fin" name="dest">${dest}</select></label>
    <div class="mgrid">
      <label class="mfield"><span>Assignee</span><select class="fin" name="who">${userOpts("alex")}</select></label>
      <label class="mfield"><span>Due date</span><input class="fin" type="date" name="due"></label>
      <label class="mfield"><span>Priority</span><select class="fin" name="pri"><option value="high">High</option><option value="med" selected>Medium</option><option value="low">Low</option></select></label>
    </div>`, fd=>{
    const title=String(fd.get("title")||"").trim(); if(!title){f.querySelector("[name=title]").focus();return false;}
    const [pid,phid]=String(fd.get("dest")).split("|"), due=fd.get("due")||null, who=fd.get("who"), pri=fd.get("pri");
    if(phid){const plan=planFor(pid),i=plan.findIndex(x=>x.id===phid),ph=plan[i];
      ph.subs.push({id:`${i+1}.${ph.subs.length+1}`,name:title,due:due||ph.due,owner:who,done:false,priority:pri==="high"?"high":undefined});}
    else tasks.push({id:"n"+(seq++),project:pid,section:"todo",title,assignee:who,due,priority:pri,desc:"",subs:[]});
    renderNav();render();
    toast(`Added “${esc(title)}” to ${esc(proj(pid).name)}${who==="alex"?" · it's in My Tasks":""}`);
  });
}
function openLeadModal(){
  const scope=state.crmScope==="all"?clients[0].id:state.crmScope;
  const ambOpts=cid=>ambassadors.filter(a=>a.client===cid).map(a=>`<option value="${a.id}">${esc(a.name)} · ${esc(a.role)}</option>`).join("");
  const f=openModal(`<h2>New lead</h2>
    <label class="mfield"><span>Full name</span><input class="fin" name="name" placeholder="e.g. Iryna Koval" required></label>
    <div class="mgrid">
      <label class="mfield"><span>Title</span><input class="fin" name="title" placeholder="Head of Growth"></label>
      <label class="mfield"><span>Company</span><input class="fin" name="company"></label>
      <label class="mfield"><span>Client</span><select class="fin" name="client">${clients.map(c=>`<option value="${c.id}" ${c.id===scope?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label>
      <label class="mfield"><span>Profile</span><select class="fin" name="amb">${ambOpts(scope)}</select></label>
      <label class="mfield"><span>Owner (SDR)</span><select class="fin" name="owner">${userOpts("karina")}</select></label>
      <label class="mfield"><span>Location</span><input class="fin" name="loc" placeholder="Kyiv, UA"></label>
    </div>`, fd=>{
    const name=String(fd.get("name")||"").trim(); if(!name){f.querySelector("[name=name]").focus();return false;}
    const l={id:"L"+(seq++),client:fd.get("client"),ambassador:fd.get("amb"),name,title:String(fd.get("title")||"").trim()||"—",company:String(fd.get("company")||"").trim()||"—",
      loc:String(fd.get("loc")||"").trim(),industry:client(fd.get("client")).industry.split(" / ")[0],source:"LinkedIn",channel:"LinkedIn",owner:fd.get("owner"),
      stage:"connecting",statusLG:"request_sent",deal:"open",dates:{},next:{date:fISO(TODAY),task:"Connection request"},strategy:"General ICP pains",touches:[],comment:""};
    leads.push(l);renderNav();render();
    const d=dupOf(l);
    toast(`Added ${esc(name)} to ${esc(client(l.client).short)} · Connecting${d.length?` — ⚑ also a lead under ${esc(d.join(", "))}`:""}`);
  });
  const cs=f.querySelector("[name=client]");cs.onchange=()=>{f.querySelector("[name=amb]").innerHTML=ambOpts(cs.value);};

$("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("open");
$("#scrim").onclick=()=>{closeDrawer();$("#sidebar").classList.remove("open");};
const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const MOON='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>';
function effectiveDark(){
  const explicit=document.documentElement.getAttribute("data-theme");
  if(explicit) return explicit==="dark";
  return !matchMedia("(prefers-color-scheme: light)").matches; // dark-first: dark unless OS is light
}
function syncThemeIcon(){ $("#themeIco").innerHTML = effectiveDark()?SUN:MOON; }
$("#themeBtn").onclick=()=>{
  const next=effectiveDark()?"light":"dark";
  document.documentElement.setAttribute("data-theme", next);
  try{localStorage.setItem("chameleon-theme",next);}catch(e){}
  syncThemeIcon();
};
try{const saved=localStorage.getItem("chameleon-theme");if(saved==="light"||saved==="dark")document.documentElement.setAttribute("data-theme",saved);}catch(e){}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#modal").classList.contains("open"))closeModal();else closeDrawer();}});
// Sidebar links are <a> without href — make them keyboard-operable
$("#nav").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("a")){e.preventDefault();e.target.click();}});

/* ---------- boot ---------- */
renderNav();go("mytasks");syncThemeIcon();
</script>
