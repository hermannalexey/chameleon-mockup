<title>Chameleon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --font: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --bg:#F4F7F5; --surface:#FFFFFF; --surface-2:#EEF3F0; --surface-3:#E6EDE9;
    --border:#E0E7E3; --border-strong:#CFD9D3;
    --ink:#16211C; --muted:#5F7269; --faint:#8697; --faint:#8A9A92;
    --accent:#12A277; --accent-strong:#0C815F; --accent-soft:#E1F4EC;
    --pri-high:#E1543B; --pri-high-soft:#FBE7E2;
    --pri-med:#D9902A; --pri-med-soft:#FaF0DC;
    --pri-low:#4E85E6; --pri-low-soft:#E6EEFC;
    --shadow:0 1px 2px rgba(16,40,30,.06), 0 4px 16px rgba(16,40,30,.06);
    --shadow-lift:0 6px 24px rgba(16,40,30,.14);
    --radius:12px; --radius-sm:8px;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#0E1613; --surface:#16211C; --surface-2:#1C2823; --surface-3:#243329;
      --border:#293831; --border-strong:#35473E;
      --ink:#E7EFEB; --muted:#9DB0A7; --faint:#6E827A;
      --accent:#2CC091; --accent-strong:#54D3AB; --accent-soft:#12312655;
      --pri-high:#F0715A; --pri-high-soft:#3a201b;
      --pri-med:#E7AA4D; --pri-med-soft:#382c14;
      --pri-low:#6C9BF0; --pri-low-soft:#1c2740;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
      --shadow-lift:0 6px 24px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1613; --surface:#16211C; --surface-2:#1C2823; --surface-3:#243329;
    --border:#293831; --border-strong:#35473E;
    --ink:#E7EFEB; --muted:#9DB0A7; --faint:#6E827A;
    --accent:#2CC091; --accent-strong:#54D3AB; --accent-soft:#12312655;
    --pri-high:#F0715A; --pri-high-soft:#3a201b;
    --pri-med:#E7AA4D; --pri-med-soft:#382c14;
    --pri-low:#6C9BF0; --pri-low-soft:#1c2740;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
    --shadow-lift:0 6px 24px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .tnum{font-variant-numeric:tabular-nums}

  .app{display:grid;grid-template-columns:262px 1fr;height:100%;overflow:hidden}

  /* ---------- Sidebar ---------- */
  .sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--accent),#0C815F);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(18,162,119,.35)}
  .logo svg{width:19px;height:19px}
  .brand b{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
  .nav-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
  .nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px}
  .nav a .ico{width:17px;height:17px;flex:none;opacity:.8}
  .nav a:hover{background:var(--surface-2);color:var(--ink)}
  .nav a.active{background:var(--accent-soft);color:var(--accent-strong)}
  .nav a.active .ico{opacity:1}
  .proj-dot{width:10px;height:10px;border-radius:3px;flex:none}
  .nav .count{margin-left:auto;font-size:11px;color:var(--faint);font-weight:700}
  .side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .side-foot .who{font-size:12.5px;font-weight:700}
  .side-foot .who small{display:block;color:var(--faint);font-weight:600;font-size:11px}

  /* ---------- Main ---------- */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);flex:none}
  .menu-btn{display:none;background:none;border:1px solid var(--border);border-radius:8px;padding:7px;color:var(--ink)}
  .title-wrap{display:flex;align-items:center;gap:11px;min-width:0}
  .title-wrap .pdot{width:14px;height:14px;border-radius:4px;flex:none}
  h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .subtle{color:var(--faint);font-size:12.5px;font-weight:600}
  .spacer{flex:1}
  .seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
  .seg button{border:none;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:6px 13px;border-radius:7px;display:flex;align-items:center;gap:6px}
  .seg button svg{width:15px;height:15px}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .icon-btn{background:none;border:1px solid var(--border);border-radius:9px;padding:8px;color:var(--muted);display:grid;place-items:center}
  .icon-btn:hover{color:var(--ink);border-color:var(--border-strong)}
  .icon-btn svg{width:17px;height:17px}
  .btn-add{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;box-shadow:0 2px 8px rgba(18,162,119,.3)}
  .btn-add:hover{background:var(--accent-strong)}
  .btn-add svg{width:16px;height:16px}

  .content{flex:1;overflow:auto;min-height:0}

  /* avatars */
  .ava{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none;letter-spacing:.01em}
  .ava.sm{width:22px;height:22px;font-size:10px}

  /* priority pill */
  .pri{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:5px}
  .pri::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pri.high{color:var(--pri-high);background:var(--pri-high-soft)}
  .pri.med{color:var(--pri-med);background:var(--pri-med-soft)}
  .pri.low{color:var(--pri-low);background:var(--pri-low-soft)}
  .due{font-size:12px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
  .due svg{width:13px;height:13px;opacity:.7}
  .due.over{color:var(--pri-high)}
  .subc{font-size:12px;font-weight:700;color:var(--faint);display:inline-flex;align-items:center;gap:4px}
  .subc svg{width:13px;height:13px}

  /* checkbox */
  .chk{width:19px;height:19px;border:2px solid var(--border-strong);border-radius:6px;flex:none;display:grid;place-items:center;background:var(--surface);transition:.12s}
  .chk svg{width:12px;height:12px;opacity:0;color:#fff}
  .chk.done{background:var(--accent);border-color:var(--accent)}
  .chk.done svg{opacity:1}

  /* ---------- Board ---------- */
  .board{display:flex;gap:16px;padding:20px 22px;align-items:flex-start;min-height:100%}
  .col{background:var(--surface-2);border-radius:14px;width:290px;flex:none;display:flex;flex-direction:column;max-height:100%}
  .col.drop{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
  .col-head{display:flex;align-items:center;gap:8px;padding:13px 14px 9px;font-weight:800;font-size:13px}
  .col-head .cdot{width:9px;height:9px;border-radius:50%}
  .col-head .n{color:var(--faint);font-weight:700}
  .col-body{padding:4px 10px 10px;display:flex;flex-direction:column;gap:9px;overflow:auto}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;box-shadow:var(--shadow);cursor:grab;display:flex;flex-direction:column;gap:9px}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.45}
  .card .ct{display:flex;gap:9px;align-items:flex-start}
  .card .ctitle{font-weight:700;font-size:13.5px;line-height:1.35}
  .card.is-done .ctitle{text-decoration:line-through;color:var(--faint)}
  .card .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card .meta .spacer{flex:1}
  .add-card{margin:2px 10px 12px;border:none;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:8px;border-radius:8px;text-align:left;display:flex;align-items:center;gap:7px}
  .add-card:hover{background:var(--surface-3);color:var(--ink)}
  .add-card svg{width:15px;height:15px}
  .composer{margin:2px 10px 12px;display:flex;flex-direction:column;gap:8px}
  .composer textarea{border:1px solid var(--border-strong);border-radius:10px;padding:10px;font-family:inherit;font-size:13.5px;resize:none;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .composer textarea:focus{outline:none;border-color:var(--accent)}
  .composer .row{display:flex;gap:8px}
  .composer .save{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-weight:700;font-size:13px}
  .composer .cancel{background:none;border:none;color:var(--muted);font-weight:700;padding:7px 10px;border-radius:8px}

  /* ---------- List ---------- */
  .list{padding:14px 22px 40px;max-width:1000px}
  .sec{margin-top:14px}
  .sec-head{display:flex;align-items:center;gap:9px;padding:10px 6px 8px;font-weight:800;font-size:14px}
  .sec-head .cdot{width:9px;height:9px;border-radius:50%}
  .sec-head .n{color:var(--faint);font-weight:700;font-size:12px}
  .row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;cursor:pointer}
  .row:hover{border-color:var(--border-strong)}
  .row .rtitle{font-weight:600;font-size:13.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.is-done .rtitle{text-decoration:line-through;color:var(--faint)}
  .row .rmeta{display:flex;align-items:center;gap:14px}
  .row .pchip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
  .list-add{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;font-size:13px;padding:9px 12px;border-radius:9px;background:none;border:1px dashed var(--border-strong);width:100%;margin-top:4px}
  .list-add:hover{color:var(--ink);border-color:var(--accent)}
  .list-add svg{width:15px;height:15px}
  @media(max-width:640px){.row .rmeta .due,.row .rmeta .pchip{display:none}}

  /* ---------- My Tasks ---------- */
  .mt{padding:16px 22px 40px;max-width:860px}
  .bucket-head{font-weight:800;font-size:14px;padding:16px 6px 8px;display:flex;align-items:center;gap:9px}
  .bucket-head .flag{width:8px;height:16px;border-radius:3px}
  .bucket-head .n{color:var(--faint);font-weight:700;font-size:12px}
  .mt .row .proj{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;color:#fff}

  /* ---------- Drawer ---------- */
  .scrim{position:fixed;inset:0;background:rgba(10,20,16,.42);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:440px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lift);transform:translateX(102%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .dr-top{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
  .dr-top .mark-btn{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 11px}
  .dr-top .mark-btn.done{background:var(--accent);border-color:var(--accent);color:#fff}
  .dr-body{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:18px}
  .dr-title{font-size:20px;font-weight:800;letter-spacing:-.02em;border:none;background:none;color:var(--ink);width:100%;font-family:inherit;line-height:1.3}
  .dr-title:focus{outline:none}
  .fields{display:flex;flex-direction:column;gap:2px}
  .field{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:10px;padding:8px 0}
  .field .k{color:var(--muted);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:8px}
  .field .k svg{width:15px;height:15px;opacity:.7}
  .field .v{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px}
  .assignee-pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);padding:4px 11px 4px 4px;border-radius:20px;font-weight:700;font-size:13px}
  .dr-sec-label{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
  .sub-item{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--border)}
  .sub-item .st{font-size:13.5px;font-weight:600}
  .sub-item.done .st{text-decoration:line-through;color:var(--faint)}
  .desc{color:var(--muted);font-size:13.5px;line-height:1.55}
  .cbox{display:flex;gap:10px;align-items:center;margin-top:6px}
  .cbox input{flex:1;border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-family:inherit;font-size:13px;background:var(--surface-2);color:var(--ink)}
  .cbox input:focus{outline:none;border-color:var(--accent);background:var(--surface)}

  @media(max-width:860px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:262px;z-index:60;transform:translateX(-104%);transition:transform .22s;box-shadow:var(--shadow-lift)}
    .sidebar.open{transform:none}
    .menu-btn{display:grid;place-items:center}
    .btn-add .lbl{display:none}
  }
</style>

      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"><svg id="themeIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>

    <div class="content" id="content"></div>
  </div>
</div>

  {id:"o5", project:"outreach", section:"done", title:"Recap: 741 MQLs delivered", assignee:"maria", due:"2026-09-15", priority:"low", desc:"Case numbers locked for the deck.", subs:[]},

  {id:"c1", project:"conf", section:"todo", title:"Confirm booth & logistics", assignee:"olena", due:"2026-09-29", priority:"high", desc:"", subs:[]},
  {id:"c2", project:"conf", section:"todo", title:"Design event one-pager", assignee:"maria", due:"2026-09-27", priority:"med", desc:"", subs:[]},
  {id:"c3", project:"conf", section:"inprog", title:"Schedule meetings (goal 100)", assignee:"alex", due:"2026-10-05", priority:"high", desc:"Goal 100; last time delivered 86 — lead with 86, then explain the goal.", subs:[{t:"Outreach list ready",done:true},{t:"Calendar link live",done:false},{t:"Follow-up template",done:false}]},
  {id:"c4", project:"conf", section:"todo", title:"Book flights & hotel", assignee:"alex", due:"2026-09-24", priority:"low", desc:"", subs:[]},
  {id:"c5", project:"conf", section:"done", title:"Pre-event LinkedIn teasers", assignee:"dmytro", due:"2026-09-18", priority:"low", desc:"", subs:[]},
];

const state = {view:"mytasks", layout:"board", selected:null, composeFor:null};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const proj = id => projects.find(p=>p.id===id);
const sec = id => sections.find(s=>s.id===id);
function fmtDue(d){
  if(!d) return "";
  const dt = new Date(d+"T00:00:00");
  const days = Math.round((dt-TODAY)/86400000);
  if(days===0) return "Today";
  if(days===1) return "Tomorrow";
  if(days===-1) return "Yesterday";
  if(days<0) return `${-days}d overdue`;
  if(days<7) return dt.toLocaleDateString("en-US",{weekday:"short"});
  return dt.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}
const isOver = d => d && new Date(d+"T00:00:00") < TODAY;
const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const CAL = svg('<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>');
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const FORK = svg('<path d="M6 3v12M6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM18 6a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM18 6v2a4 4 0 0 1-4 4H6"/>');
function ava(uid,sm){const u=users[uid];return `<span class="ava ${sm?'sm':''}" style="background:${u.color}" title="${u.name}">${u.init}</span>`;}
function priPill(p){const L={high:"High",med:"Medium",low:"Low"};return `<span class="pri ${p}">${L[p]}</span>`;}
function subCount(t){if(!t.subs.length)return"";const d=t.subs.filter(s=>s.done).length;return `<span class="subc">${FORK}${d}/${t.subs.length}</span>`;}

/* ---------- sidebar projects ---------- */
function renderNav(){
  const pn=$("#projnav");pn.innerHTML="";
  projects.forEach(p=>{
    const open=tasks.filter(t=>t.project===p.id&&t.section!=="done").length;
    const a=el("a",state.view===p.id?"active":"",`<span class="proj-dot" style="background:${p.color}"></span>${p.name}<span class="count">${open}</span>`);
    a.dataset.view=p.id;a.onclick=()=>go(p.id);pn.appendChild(a);
  });
  document.querySelectorAll('#nav>a').forEach(a=>{
    a.classList.toggle("active",a.dataset.view===state.view);
    a.onclick=()=>go(a.dataset.view);
  });
}

/* ---------- routing ---------- */
function go(view){
  state.view=view;state.composeFor=null;
  $("#sidebar").classList.remove("open");
  const isProj = !!proj(view);
  $("#seg").hidden = !isProj;
  const t=$("#viewTitle"), sub=$("#viewSub"), pd=$("#pdot");
  if(view==="mytasks"){t.textContent="My Tasks";sub.textContent="";pd.style.display="none";}
  else if(view==="inbox"){t.textContent="Inbox";sub.textContent="";pd.style.display="none";}
  else{const p=proj(view);t.textContent=p.name;pd.style.display="";pd.style.background=p.color;
       const open=tasks.filter(x=>x.project===p.id&&x.section!=="done").length;sub.textContent=open+" open";}
  renderNav();render();
  $("#content").scrollTop=0;
}

/* ---------- render dispatch ---------- */
function render(){
  const c=$("#content");c.innerHTML="";
  if(state.view==="mytasks") return renderMyTasks(c);
  if(state.view==="inbox")   return renderInbox(c);
  if(state.layout==="board") return renderBoard(c);
  return renderList(c);
}

/* ---------- My Tasks ---------- */
function renderMyTasks(c){
  const wrap=el("div","mt");
  const mine=tasks.filter(t=>t.assignee==="alex");
  const buckets=[
    {key:"over", label:"Overdue", color:"#E1543B", test:t=>t.section!=="done"&&isOver(t.due)},
    {key:"today",label:"Today",   color:"#D9902A", test:t=>t.section!=="done"&&t.due===fISO(TODAY)},
    {key:"week", label:"This week",color:"#12A277",test:t=>{const d=days(t.due);return t.section!=="done"&&d>0&&d<7;}},
    {key:"later",label:"Later",   color:"#4E85E6", test:t=>{const d=days(t.due);return t.section!=="done"&&d>=7;}},
    {key:"done", label:"Completed",color:"#8A9A92",test:t=>t.section==="done"},
  ];
  buckets.forEach(b=>{
    const items=mine.filter(b.test);if(!items.length)return;
    const h=el("div","bucket-head",`<span class="flag" style="background:${b.color}"></span>${b.label}<span class="n">${items.length}</span>`);
    wrap.appendChild(h);
    items.forEach(t=>wrap.appendChild(myRow(t)));
  });
  c.appendChild(wrap);
}
function myRow(t){
  const p=proj(t.project);
  const r=el("div","row"+(t.section==="done"?" is-done":""));
  r.innerHTML=`<span class="chk ${t.section==="done"?"done":""}">${CHECK}</span>
    <span class="rtitle">${t.title}</span>
    <span class="rmeta">
      <span class="proj" style="background:${p.color}">${p.name.split(" ")[0]}</span>
      ${t.due?`<span class="due ${isOver(t.due)&&t.section!=="done"?"over":""}">${CAL}${fmtDue(t.due)}</span>`:""}
      ${priPill(t.priority)}
    </span>`;
  r.querySelector(".chk").onclick=e=>{e.stopPropagation();toggleDone(t);};
  r.onclick=()=>openTask(t.id);
  return r;
}
const fISO=d=>d.toISOString().slice(0,10);
const days=d=>d?Math.round((new Date(d+"T00:00:00")-TODAY)/86400000):9999;

/* ---------- Board ---------- */
function renderBoard(c){
  const board=el("div","board");
  sections.forEach(s=>{
    const items=tasks.filter(t=>t.project===state.view&&t.section===s.id);
    const col=el("div","col");col.dataset.sec=s.id;
    col.appendChild(el("div","col-head",`<span class="cdot" style="background:${s.color}"></span>${s.name}<span class="n">${items.length}</span>`));
    const body=el("div","col-body");
    items.forEach(t=>body.appendChild(card(t)));
    col.appendChild(body);
    if(state.composeFor===s.id){col.appendChild(composer(s.id));}
    else{const add=el("button","add-card",`${svg('<path d="M12 5v14M5 12h14"/>')}Add task`);add.onclick=()=>{state.composeFor=s.id;render();};col.appendChild(add);}
    // drag targets
    col.ondragover=e=>{e.preventDefault();col.classList.add("drop");};
    col.ondragleave=()=>col.classList.remove("drop");
    col.ondrop=e=>{e.preventDefault();col.classList.remove("drop");const id=e.dataTransfer.getData("id");const t=tasks.find(x=>x.id===id);if(t){t.section=s.id;renderNav();render();}};
    board.appendChild(col);
  });
  c.appendChild(board);
  if(state.composeFor){const ta=board.querySelector(".composer textarea");if(ta)ta.focus();}
}
function card(t){
  const cd=el("div","card"+(t.section==="done"?" is-done":""));
  cd.draggable=true;
  cd.innerHTML=`<div class="ct"><span class="chk ${t.section==="done"?"done":""}">${CHECK}</span><span class="ctitle">${t.title}</span></div>
    <div class="meta">${priPill(t.priority)}${subCount(t)}
      ${t.due?`<span class="due ${isOver(t.due)&&t.section!=="done"?"over":""}">${CAL}${fmtDue(t.due)}</span>`:""}
      <span class="spacer"></span>${ava(t.assignee,true)}</div>`;
  cd.querySelector(".chk").onclick=e=>{e.stopPropagation();toggleDone(t);};
  cd.querySelector(".ctitle").onclick=()=>openTask(t.id);
  cd.ondragstart=e=>{e.dataTransfer.setData("id",t.id);cd.classList.add("dragging");};
  cd.ondragend=()=>cd.classList.remove("dragging");
  return cd;
}
function composer(secId){
  const w=el("div","composer");
  w.innerHTML=`<textarea rows="2" placeholder="Task name…"></textarea><div class="row"><button class="save">Add task</button><button class="cancel">Cancel</button></div>`;
  const ta=w.querySelector("textarea");
  const add=()=>{const v=ta.value.trim();if(v){tasks.push({id:"n"+(seq++),project:state.view,section:secId,title:v,assignee:"alex",due:null,priority:"med",desc:"",subs:[]});}state.composeFor=secId;renderNav();render();};
  w.querySelector(".save").onclick=add;
  w.querySelector(".cancel").onclick=()=>{state.composeFor=null;render();};
  ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();add();}if(e.key==="Escape"){state.composeFor=null;render();}};
  return w;
}

/* ---------- List ---------- */
function renderList(c){
  const wrap=el("div","list");
  sections.forEach(s=>{
    const items=tasks.filter(t=>t.project===state.view&&t.section===s.id);
    if(!items.length && s.id==="done") return;
    const box=el("div","sec");
    box.appendChild(el("div","sec-head",`<span class="cdot" style="background:${s.color}"></span>${s.name}<span class="n">${items.length}</span>`));
    items.forEach(t=>box.appendChild(listRow(t)));
    if(s.id!=="done"){const add=el("button","list-add",`${svg('<path d="M12 5v14M5 12h14"/>')}Add task`);
      add.onclick=()=>{tasks.push({id:"n"+(seq++),project:state.view,section:s.id,title:"New task",assignee:"alex",due:null,priority:"med",desc:"",subs:[]});renderNav();render();};
      box.appendChild(add);}
    wrap.appendChild(box);
  });
  c.appendChild(wrap);
}
function listRow(t){
  const r=el("div","row"+(t.section==="done"?" is-done":""));
  r.innerHTML=`<span class="chk ${t.section==="done"?"done":""}">${CHECK}</span>
    <span class="rtitle">${t.title}</span>
    <span class="rmeta">${subCount(t)}
      ${t.due?`<span class="due ${isOver(t.due)&&t.section!=="done"?"over":""}">${CAL}${fmtDue(t.due)}</span>`:""}
      ${priPill(t.priority)}${ava(t.assignee,true)}</span>`;
  r.querySelector(".chk").onclick=e=>{e.stopPropagation();toggleDone(t);};
  r.onclick=()=>openTask(t.id);
  return r;
}

/* ---------- Inbox (light placeholder, still real content) ---------- */
function renderInbox(c){
  const wrap=el("div","mt");
  const notes=[
    {u:"maria",txt:"commented on <b>Build ICP list — fintech UA</b>",t:"2h"},
    {u:"dmytro",txt:"completed <b>Pre-event LinkedIn teasers</b>",t:"5h"},
    {u:"olena",txt:"assigned you <b>Confirm booth & logistics</b>",t:"1d"},
  ];
  wrap.appendChild(el("div","bucket-head",`<span class="flag" style="background:#4E85E6"></span>Recent<span class="n">${notes.length}</span>`));
  notes.forEach(n=>{
    const r=el("div","row");r.style.cursor="default";
    r.innerHTML=`${ava(n.u)}<span class="rtitle" style="font-weight:600">${users[n.u].name} ${n.txt}</span><span class="rmeta"><span class="due">${n.t}</span></span>`;
    wrap.appendChild(r);
  });
  c.appendChild(wrap);
}

/* ---------- actions ---------- */
function toggleDone(t){
  if(t.section==="done"){t.section=t._prev||"todo";}
  else{t._prev=t.section;t.section="done";}
  renderNav();render();
  if(state.selected===t.id)openTask(t.id);
}

/* ---------- Drawer ---------- */
function openTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  state.selected=id;
  const p=proj(t.project),s=sec(t.section),u=users[t.assignee];
  const dr=$("#drawer");
  dr.innerHTML=`
    <div class="dr-top">
      <button class="mark-btn ${t.section==="done"?"done":""}" id="drMark">${CHECK}${t.section==="done"?"Completed":"Mark complete"}</button>
      <div class="spacer"></div>
      <button class="icon-btn" id="drClose" aria-label="Close">${svg('<path d="M18 6 6 18M6 6l12 12"/>')}</button>
    </div>
    <div class="dr-body">
      <input class="dr-title" value="${t.title.replace(/"/g,'&quot;')}">
      <div class="fields">
        <div class="field"><span class="k">${svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>')}Assignee</span><span class="v"><span class="assignee-pill">${ava(t.assignee,true)}${u.name}</span></span></div>
        <div class="field"><span class="k">${CAL}Due date</span><span class="v ${isOver(t.due)&&t.section!=="done"?"":""}">${t.due?new Date(t.due+"T00:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}):"—"}</span></div>
        <div class="field"><span class="k">${svg('<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22V3"/>')}Priority</span><span class="v">${priPill(t.priority)}</span></div>
        <div class="field"><span class="k">${svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>')}Project</span><span class="v"><span class="proj-dot" style="width:11px;height:11px;border-radius:4px;background:${p.color};display:inline-block"></span> ${p.name}</span></div>
        <div class="field"><span class="k">${svg('<path d="M4 6h16M4 12h16M4 18h10"/>')}Status</span><span class="v">${s.name}</span></div>
      </div>
      <div>
        <div class="dr-sec-label">Description</div>
        <div class="desc">${t.desc?t.desc:"<i style='color:var(--faint)'>No description yet.</i>"}</div>
      </div>
      <div>
        <div class="dr-sec-label">Subtasks ${t.subs.length?`· ${t.subs.filter(x=>x.done).length}/${t.subs.length}`:""}</div>
        <div id="drSubs">${t.subs.length?"":"<div class='desc'><i style='color:var(--faint)'>No subtasks.</i></div>"}</div>
      </div>
      <div>
        <div class="dr-sec-label">Comments</div>
        <div class="cbox">${ava("alex",true)}<input placeholder="Write a comment…"></div>
      </div>
    </div>`;
  const subsBox=dr.querySelector("#drSubs");
  t.subs.forEach((st,i)=>{
    const it=el("div","sub-item"+(st.done?" done":""));
    it.innerHTML=`<span class="chk ${st.done?"done":""}">${CHECK}</span><span class="st">${st.t}</span>`;
    it.querySelector(".chk").onclick=()=>{st.done=!st.done;openTask(id);render();};
    subsBox.appendChild(it);
  });
  dr.querySelector("#drClose").onclick=closeDrawer;
  dr.querySelector("#drMark").onclick=()=>toggleDone(t);
  dr.querySelector(".dr-title").onchange=e=>{t.title=e.target.value;render();};
  dr.classList.add("open");dr.setAttribute("aria-hidden","false");
  $("#scrim").classList.add("open");
}
function closeDrawer(){state.selected=null;$("#drawer").classList.remove("open");$("#drawer").setAttribute("aria-hidden","true");$("#scrim").classList.remove("open");}

/* ---------- wire top bar ---------- */
$("#seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  state.layout=b.dataset.layout;state.composeFor=null;
  $("#seg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  render();
});
$("#addBtn").onclick=()=>{
  if(proj(state.view)){state.layout="board";$("#seg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.layout==="board"));state.composeFor="todo";render();}
  else{go("web");state.composeFor="todo";render();}
};
$("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("open");
$("#scrim").onclick=()=>{closeDrawer();$("#sidebar").classList.remove("open");};
$("#themeBtn").onclick=()=>{
  const root=document.documentElement;
  const dark=root.getAttribute("data-theme")==="dark"||(!root.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme",dark?"light":"dark");
};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});

/* ---------- boot ---------- */
renderNav();go("mytasks");
</script>
